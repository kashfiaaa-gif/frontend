<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - NoEtra</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <h1>NoEtra</h1>

            <p class="login-subtitle">
                A Smart Self-Learning Roadmap
            </p>

            <h2>Create Account</h2>

            <p>
                Register to start your learning journey.
            </p>


            <form id="registerForm">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >


                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    id="registerBtn"
                >
                    Register
                </button>

            </form>


            <p
                id="registerMessage"
                class="login-message"
            ></p>


            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>
</html>
