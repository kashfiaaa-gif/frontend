<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quizzes — NoEtra</title>
<style>
  :root {
    --ink: #1f1730;;
    --paper: #faf8fc;
    --paper-raised: #ffffff;
    --line: #e5e0ec;;
    --accent: #7e368d;       /* primary purple */
    --accent-soft: #f1e8f5;  /* light purple */
    --correct: #3f7a5a;
    --incorrect: #b5482f;
    --muted: #6f6780;
   --font-family: Arial, Helvetica, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    min-height: 100vh;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header.page-head {
    margin-bottom: 40px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 34px;
    font-weight: 400;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .subhead {
    color: var(--muted);
    margin-top: 8px;
    font-size: 15px;
  }

  .section-heading {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 400;
    margin: 0 0 18px;
  }

  /* ---------- Quiz list ---------- */

  #quizList { display: flex; flex-direction: column; gap: 12px; }

  .quiz-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .quiz-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .quiz-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .quiz-card-title {
    font-family: var(--font-display);
    font-size: 19px;
  }

  .quiz-card-topic {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .quiz-card-arrow {
    font-size: 20px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 15px;
  }

  /* ---------- Taking a quiz ---------- */

  #quizRunner { display: none; }

  .runner-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 16px;
  }

  .back-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 0;
    font-family: var(--font-ui);
  }
  .back-link:hover { color: var(--ink); }

  .tracker {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tracker-dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: var(--paper-raised);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }

  .tracker-dot.answered {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  .tracker-dot.current {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  .question-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 36px 32px;
  }

  .q-number {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 14px;
  }

  .q-text {
    font-family: var(--font-display);
    font-size: 22px;
    line-height: 1.4;
    margin-bottom: 28px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }

  .option:hover { border-color: var(--accent); }

  .option.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .option-letter {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    color: var(--muted);
  }

  .option.selected .option-letter {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .option-text { font-size: 15px; }

  .runner-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    gap: 12px;
  }

  button.nav-btn {
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.12s ease;
  }

  button.nav-btn:hover:not(:disabled) { border-color: var(--accent); }
  button.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  button.submit-btn {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  button.submit-btn:hover { opacity: 0.9; border-color: var(--ink); }

  .progress-note {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 16px;
  }

  /* ---------- Results ---------- */

  #resultsScreen { display: none; text-align: center; padding-top: 24px; }

  .score-ring {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    border: 3px solid var(--accent);
    background: var(--paper-raised);
  }

  .score-number {
    font-family: var(--font-display);
    font-size: 42px;
  }

  .score-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 4px;
  }

  .results-detail {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 32px;
  }

  .results-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .review-section {
    text-align: left;
    margin-top: 40px;
  }

  .review-heading {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 400;
    margin-bottom: 16px;
  }

  .review-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 14px;
  }

  .review-card.correct { border-left-color: var(--correct); }
  .review-card.incorrect { border-left-color: var(--incorrect); }

  .review-q-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }

  .review-q-text {
    font-family: var(--font-display);
    font-size: 17px;
    line-height: 1.4;
  }

  .review-badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .review-badge.correct {
    background: var(--correct);
    color: white;
  }

  .review-badge.incorrect {
    background: var(--incorrect);
    color: white;
  }

  .review-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .review-option .option-letter {
    width: 22px;
    height: 22px;
    font-size: 11px;
  }

  .review-option.is-correct-answer {
    border-color: var(--correct);
    background: rgba(63, 122, 90, 0.08);
  }

  .review-option.is-correct-answer .option-letter {
    background: var(--correct);
    border-color: var(--correct);
    color: white;
  }

  .review-option.is-wrong-selected {
    border-color: var(--incorrect);
    background: rgba(181, 72, 47, 0.08);
  }

  .review-option.is-wrong-selected .option-letter {
    background: var(--incorrect);
    border-color: var(--incorrect);
    color: white;
  }

  .review-tag {
    margin-left: auto;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .review-tag.tag-correct { color: var(--correct); }
  .review-tag.tag-wrong { color: var(--incorrect); }

  .review-unanswered {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    margin-top: 4px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: var(--paper);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ===== Quiz List Screen ===== -->
  <div id="listScreen">
    <header class="page-head">
      <div class="eyebrow">Practice</div>
      <h1>Practice Quiz</h1>
      <div class="subhead">Test your knowledge after completing a learning roadmap.</div>
    </header>

    <h2 class="section-heading">Select a Quiz</h2>
    <div id="quizList"></div>
  </div>

   
  <!-- ===== Quiz Runner Screen ===== -->
  <div id="quizRunner">
    <div class="runner-topbar">
      <button class="back-link" onclick="exitQuiz()">← Back to quizzes</button>
      <div class="tracker" id="tracker"></div>
    </div>

    <div class="question-card">
      <div class="q-number" id="qNumber"></div>
      <div class="q-text" id="qText"></div>
      <div id="options"></div>
    </div>

    <div class="runner-nav">
      <button class="nav-btn" id="prevBtn" onclick="goPrev()">← Previous</button>
      <div id="navRight"></div>
    </div>
    <div class="progress-note" id="progressNote"></div>
  </div>

  <!-- ===== Results Screen ===== -->
  <div id="resultsScreen">
    <div class="score-ring">
      <div class="score-number" id="scorePercent"></div>
      <div class="score-label">Score</div>
    </div>
    <div class="results-detail" id="resultsDetail"></div>
    <div class="results-actions">
      <button class="nav-btn submit-btn" onclick="exitQuiz()">Back to quizzes</button>
    </div>

    <div class="review-section" id="reviewSection">
      <div class="review-heading">Review your answers</div>
      <div id="reviewList"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

        { question_id: "cyb-20", question_text: "Why should software be kept up to date?",
          option_a: "To use more storage", option_b: "To patch known security vulnerabilities", option_c: "To slow down the device", option_d: "It has no security benefit", correct_option: "B" }
      ]
    }
  ];

  function getToken() {
    return localStorage.getItem("token");
  }

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2500);
  }

  function requireLogin() {
    if (!getToken()) {
      window.location.href = "login.html";
      return false;
    }
    return true;
  }

  // ---------- Load quiz list ----------

  async function loadQuizzes() {
    const list = document.getElementById("quizList");

    let quizzes = [];

    try {
      const res = await fetch(`${API_URL}/api/quizzes`);
      quizzes = await res.json();
    } catch (err) {
      // Backend unreachable — fall through to the static quizzes below.
      quizzes = [];
    }

    // Until the admin adds quizzes on the backend, show the built-in
    // practice quizzes instead of an empty list.
    if (!quizzes || quizzes.length === 0) {
      quizzes = STATIC_QUIZZES;
    }

    if (quizzes.length === 0) {
      list.innerHTML = `<div class="empty-state">No quizzes yet. Check back once your admin adds some.</div>`;
      return;
    }

    list.innerHTML = quizzes.map(q => `
      <div class="quiz-card" tabindex="0" onclick="openQuiz('${q.quiz_id}')"
           onkeydown="if(event.key==='Enter') openQuiz('${q.quiz_id}')">
        <div>
          <div class="quiz-card-title">${escapeHtml(q.quiz_title)}</div>
          <div class="quiz-card-topic">${escapeHtml(q.topic_name)}${q.description ? " — " + escapeHtml(q.description) : ""}</div>
        </div>
        <div class="quiz-card-arrow">→</div>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  // ---------- Open + take a quiz ----------

  async function openQuiz(quizId) {
    if (!requireLogin()) return;

    // Static, admin-hasn't-added-anything-yet fallback quiz — no backend call.
    const staticQuiz = STATIC_QUIZZES.find(q => q.quiz_id === quizId);
    if (staticQuiz) {
      currentQuiz = staticQuiz;
      currentIndex = 0;
      answers = {};

      document.getElementById("listScreen").style.display = "none";
      document.getElementById("resultsScreen").style.display = "none";
      document.getElementById("quizRunner").style.display = "block";

      renderTracker();
      renderQuestion();
      return;
    }

    try {
      const res = await fetch(`${API_URL}/api/quizzes/${quizId}`, {
        headers: { "Authorization": `Bearer ${getToken()}` }
      });

      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
        return;
      }

      const data = await res.json();

      if (!res.ok) {
        showToast(data.error || "Couldn't load this quiz.");
        return;
      }

      currentQuiz = data;
      currentIndex = 0;
      answers = {};

      document.getElementById("listScreen").style.display = "none";
      document.getElementById("resultsScreen").style.display = "none";
      document.getElementById("quizRunner").style.display = "block";

      renderTracker();
      renderQuestion();
    } catch (err) {
      showToast("Something went wrong loading the quiz.");
    }
  }

  function renderTracker() {
    const tracker = document.getElementById("tracker");
    tracker.innerHTML = currentQuiz.questions.map((q, i) => {
      const isAnswered = answers[q.question_id] !== undefined;
      const isCurrent = i === currentIndex;
      const classes = ["tracker-dot"];
      if (isCurrent) classes.push("current");
      else if (isAnswered) classes.push("answered");
      return `<div class="${classes.join(" ")}" onclick="jumpTo(${i})">${i + 1}</div>`;
    }).join("");
  }

  function jumpTo(index) {
    currentIndex = index;
    renderTracker();
    renderQuestion();
  }

  function renderQuestion() {
    const q = currentQuiz.questions[currentIndex];
    const total = currentQuiz.questions.length;

    document.getElementById("qNumber").textContent = `Question ${currentIndex + 1} of ${total}`;
    document.getElementById("qText").textContent = q.question_text;

    const options = [
      { key: "A", text: q.option_a },
      { key: "B", text: q.option_b },
      { key: "C", text: q.option_c },
      { key: "D", text: q.option_d }
    ];

    const selected = answers[q.question_id];

    document.getElementById("options").innerHTML = options.map(opt => `
      <div class="option ${selected === opt.key ? "selected" : ""}" onclick="selectAnswer('${opt.key}')">
        <div class="option-letter">${opt.key}</div>
        <div class="option-text">${escapeHtml(opt.text)}</div>
      </div>
    `).join("");

    document.getElementById("prevBtn").disabled = currentIndex === 0;

    const navRight = document.getElementById("navRight");
    if (currentIndex === total - 1) {
      navRight.innerHTML = `<button class="nav-btn submit-btn" onclick="submitQuiz()">Submit quiz</button>`;
    } else {
      navRight.innerHTML = `<button class="nav-btn" onclick="goNext()">Next →</button>`;
    }

    const answeredCount = Object.keys(answers).length;
    document.getElementById("progressNote").textContent =
      `${answeredCount} of ${total} answered — you can skip around and answer in any order.`;
  }

  function selectAnswer(optionKey) {
    const q = currentQuiz.questions[currentIndex];
    answers[q.question_id] = optionKey;
    renderTracker();
    renderQuestion();
  }

  function goNext() {
    if (currentIndex < currentQuiz.questions.length - 1) {
      currentIndex++;
      renderTracker();
      renderQuestion();
    }
  }

  function goPrev() {
    if (currentIndex > 0) {
      currentIndex--;
      renderTracker();
      renderQuestion();
    }
  }

  // ---------- Submit ----------

  async function submitQuiz() {
    if (Object.keys(answers).length === 0) {
      showToast("Answer at least one question before submitting.");
      return;
    }

    // Static quizzes are scored right here in the browser.
    if (currentQuiz.isStatic) {
      const total = currentQuiz.questions.length;
      let score = 0;
      const breakdown = [];

      currentQuiz.questions.forEach(q => {
        const selected = answers[q.question_id] || null;
        const isCorrect = selected === q.correct_option;
        if (isCorrect) score++;

        breakdown.push({
          question_id: q.question_id,
          question_text: q.question_text,
          option_a: q.option_a,
          option_b: q.option_b,
          option_c: q.option_c,
          option_d: q.option_d,
          selected_option: selected,
          correct_option: q.correct_option,
          is_correct: isCorrect
        });
      });

      showResults({
        score,
        totalQuestions: total,
        percentage: Math.round((score / total) * 100),
        breakdown
      });
      return;
    }

    const answerList = Object.entries(answers).map(([question_id, selected_option]) => ({
      question_id: Number(question_id),
      selected_option
    }));

    try {
      const res = await fetch(`${API_URL}/api/quizzes/${currentQuiz.quiz_id}/submit`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${getToken()}`
        },
        body: JSON.stringify({ answers: answerList })
      });

      const data = await res.json();

      if (!res.ok) {
        showToast(data.error || "Couldn't submit your answers.");
        return;
      }

      showResults(data);
    } catch (err) {
      showToast("Something went wrong submitting the quiz.");
    }
  }

  function showResults(data) {
    document.getElementById("quizRunner").style.display = "none";
    document.getElementById("resultsScreen").style.display = "block";

    document.getElementById("scorePercent").textContent = `${data.percentage}%`;
    document.getElementById("resultsDetail").textContent =
      `You got ${data.score} out of ${data.totalQuestions} correct.`;

    renderReview(data.breakdown || []);
  }

  function renderReview(breakdown) {
    const reviewSection = document.getElementById("reviewSection");
    const reviewList = document.getElementById("reviewList");

    if (!breakdown.length) {
      reviewSection.style.display = "none";
      return;
    }

    reviewSection.style.display = "block";

    const optionKeys = ["A", "B", "C", "D"];

    reviewList.innerHTML = breakdown.map((item, i) => {
      const optionsHtml = optionKeys.map(key => {
        const text = item[`option_${key.toLowerCase()}`];
        const isCorrectAnswer = key === item.correct_option;
        const isSelected = key === item.selected_option;
        const isWrongSelected = isSelected && !isCorrectAnswer;

        let classes = "review-option";
        if (isCorrectAnswer) classes += " is-correct-answer";
        if (isWrongSelected) classes += " is-wrong-selected";

        let tag = "";
        if (isCorrectAnswer) tag = `<span class="review-tag tag-correct">Correct answer</span>`;
        else if (isWrongSelected) tag = `<span class="review-tag tag-wrong">Your answer</span>`;

        return `
          <div class="${classes}">
            <div class="option-letter">${key}</div>
            <div class="option-text">${escapeHtml(text)}</div>
            ${tag}
          </div>
        `;
      }).join("");

      const unanswered = !item.selected_option
        ? `<div class="review-unanswered">You didn't answer this question.</div>`
        : "";

      return `
        <div class="review-card ${item.is_correct ? "correct" : "incorrect"}">
          <div class="review-q-header">
            <div class="review-q-text">${i + 1}. ${escapeHtml(item.question_text)}</div>
            <div class="review-badge ${item.is_correct ? "correct" : "incorrect"}">
              ${item.is_correct ? "Correct" : "Incorrect"}
            </div>
          </div>
          ${optionsHtml}
          ${unanswered}
        </div>
      `;
    }).join("");
  }

  function exitQuiz() {
    currentQuiz = null;
    document.getElementById("quizRunner").style.display = "none";
    document.getElementById("resultsScreen").style.display = "none";
    document.getElementById("listScreen").style.display = "block";
    loadQuizzes();
  }

  // ---------- Init ----------
  loadQuizzes();
</script>

</body>
</html>
