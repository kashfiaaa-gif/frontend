<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - NoEtra</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


    <!-- =========================
         FORGOT PASSWORD PAGE
    ========================== -->

    <main class="forgot-page">

        <div class="forgot-card">


            <!-- LOGO -->

            <div class="forgot-logo">
                🎓 NoEtra
            </div>


            <!-- TITLE -->

            <h1>
                Reset Your Password
            </h1>


            <p class="forgot-description">
                Enter your registered email address and
                we'll help you reset your password.
            </p>


            <!-- FORM -->

            <form id="forgotPasswordForm">


                <label for="email">
                    Enter your email
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >


                <button
                    type="submit">

                    Send Reset Link

                </button>


            </form>


            <!-- MESSAGE -->

            <p id="message"></p>


            <!-- BACK TO LOGIN -->

            <div class="back-login">

                <a href="login.html">
                    ← Back to Login
                </a>

            </div>


        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/script.js"></script>


    <script>

        const forgotForm =
            document.getElementById("forgotPasswordForm");


        if (forgotForm) {

            forgotForm.addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();

                    if (typeof submitForgotPassword === "function") {

                        submitForgotPassword();

                    }

                }
            );

        }

    </script>


    <!-- =========================
         FORGOT PASSWORD PAGE CSS
    ========================== -->

    <style>

        /* PAGE */

        .forgot-page {

            min-height: 100vh;

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;

            box-sizing: border-box;

            background: #faf8fc;

        }


        /* CARD */

        .forgot-card {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 40px;

            box-sizing: border-box;

            border-radius: 18px;

            border: 1px solid #d9cde0;

            box-shadow:
                0 10px 30px rgba(53, 21, 67, 0.12);

            text-align: center;

        }


        /* LOGO */

        .forgot-logo {

            color: #4b1f5f;

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 20px;

        }


        /* TITLE */

        .forgot-card h1 {

            color: #24162f;

            font-size: 28px;

            margin: 0 0 12px;

        }


        /* DESCRIPTION */

        .forgot-description {

            color: #75687c;

            font-size: 14px;

            line-height: 1.6;

            margin: 0 0 28px;

        }


        /* FORM */

        #forgotPasswordForm {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 0;

            text-align: left;

        }


        /* LABEL */

        #forgotPasswordForm label {

            display: block;

            color: #4b1f5f;

            font-weight: bold;

            margin: 0 0 8px;

        }


        /* INPUT */

        #forgotPasswordForm input {

            width: 100%;

            max-width: none;

            padding: 13px;

            box-sizing: border-box;

            border: 2px solid #d9cde0;

            border-radius: 8px;

            background: white;

            color: #1f1730;

            font-size: 16px;

            outline: none;

        }


        #forgotPasswordForm input:focus {

            border-color: #6a347c;

        }


        /* BUTTON */

        #forgotPasswordForm button {

            width: 100%;

            margin-top: 20px;

            background: #4b1f5f;

            color: white;

            border: none;

            padding: 13px 20px;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

        }


        #forgotPasswordForm button:hover {

            background: #673579;

        }


        /* MESSAGE */

        #message {

            min-height: 20px;

            margin: 16px 0 0;

            text-align: center;

            font-size: 14px;

        }


        /* BACK LOGIN */

        .back-login {

            margin-top: 22px;

            text-align: center;

        }


        .back-login a {

            color: #6a347c;

            text-decoration: none;

            font-size: 14px;

        }


        .back-login a:hover {

            color: #4b1f5f;

            text-decoration: underline;

        }


        /* MOBILE */

        @media (max-width: 480px) {

            .forgot-page {

                padding: 25px 15px;

            }


            .forgot-card {

                padding: 30px 22px;

            }


            .forgot-logo {

                font-size: 28px;

            }


            .forgot-card h1 {

                font-size: 25px;

            }

        }

    </style>


</body>

</html>
