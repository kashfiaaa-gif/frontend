<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | NoEtra</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="login-page">


    <!-- =========================
         LOGIN CONTAINER
    ========================== -->

    <main class="login-container">

        <section class="login-card">


            <!-- LOGO -->

            <div class="logo">
                🎓 NoEtra
            </div>


            <!-- TITLE -->

            <h1>
                Welcome!
            </h1>


            <p class="subtitle">
                Login to continue your learning journey
            </p>


            <!-- =========================
                 LOGIN FORM
            ========================== -->

            <form id="loginForm">


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <!-- =========================
                     FORGOT PASSWORD
                ========================== -->

                <div class="forgot">

                    <a
                        href="forgot-password.html"
                        id="forgotPassword">

                        Forgot Password?

                    </a>

                </div>


                <!-- =========================
                     LOGIN BUTTON
                ========================== -->

                <button
                    type="submit"
                    id="loginBtn">

                    🔐 Login

                </button>


            </form>


            <!-- MESSAGE -->

            <p id="message"></p>


            <!-- =========================
                 BACK TO HOME
            ========================== -->

            <p class="home-link">

                <a href="index.html">
                    ← Back to Home
                </a>

            </p>


        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/script.js"></script>


    <!-- =========================
         FORGOT PASSWORD LINK
    ========================== -->

    <script>

        const forgotPasswordLink =
            document.getElementById("forgotPassword");


        if (forgotPasswordLink) {

            forgotPasswordLink.addEventListener(
                "click",
                function () {

                    window.location.href =
                        "forgot-password.html";

                }
            );

        }

    </script>


</body>

</html>
